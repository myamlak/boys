name: CI

on:
  push:
    branches: [main]
  # Required status checks are reported on pull requests only when the workflow
  # runs on pull_request: a checks-only branch-protection rule over a
  # push-triggered workflow would block every PR on checks that never appear.
  # This trigger is therefore load-bearing for the protection rule on main, not
  # a convenience.
  pull_request:
    branches: [main]

# Cancel a still-running older run when a newer push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Coverage policy -------------------------------------------------------
#
# boys is a PUBLIC repository, so GitHub gives it unlimited free standard-runner
# minutes AND double the machine: the same label is 4 vCPU / 16 GB here rather
# than the 2 vCPU / 8 GB of the reduced tier. The direction is deliberate: boys
# gets the fullest coverage standard runners allow.
#
# STANDARD HOSTED LABELS ONLY (windows-latest, windows-11-arm, ubuntu-latest,
# ubuntu-24.04-arm, macos-latest, macos-15-intel). Larger runners are billed
# and would break the free assumption — never add one here.
#
# boys is a numeric kernel library with an AVX2/FMA gate and an fp16 seam, so
# architecture and sanitizer coverage is where its risk actually lives:
#
#   windows-latest    MSVC   Debug + Release   (the verified toolchain)
#   windows-11-arm    MSVC   Release           (arm64 — see the note below)
#   ubuntu-latest     GCC    Debug + Release   (the verified toolchain)
#   ubuntu-latest     Clang  Debug + Release   (the -ffp-contract class)
#   ubuntu-latest     ASan+UBSan               (highest value per minute here)
#   ubuntu-24.04-arm  GCC    Release           (arm64 — see the note below)
#   macos-latest      AppleClang Release       (arm64 — see the note below)
#   macos-15-intel    AppleClang Release       (x64: macos-latest is Apple Silicon)
#
# FULL SUITE ON EVERY LEG, Debug and Release alike. No fast-subset rule
# applies here: such a rule exists for MSVC-side cost (MSVC Debug is 10-50x
# the Release cost of the heavy suites, where Linux Debug is only ~2x), and a
# build-only Debug leg would never execute the nine assert(BoysAvx2Available())
# sites — precisely what a Debug leg is for. boys' suite is small (~50 tests,
# 4096-element sweeps) and its minutes are free, so the cost reasoning does not
# arise.
#
# THE OPTION MATRIX is separate from the platform legs above and answers a
# different question: not "does this platform build" but "does each certified
# configuration of the library hold its own books". It was one extra dimension
# carried as an ad-hoc step inside two legs - a second tree built with
# BOYS_MULADD_SEPARATE=ON and the accuracy gate run in it - and a step is the
# wrong shape for what is now an axis-crossed list: it could only ever measure
# one axis, on the two legs that happened to carry it, and a member added to
# any axis landed where CI could not see it. The configurations are data
# (.github/option-matrix.json), the workflow expands them, and a member is
# added by regenerating that file. See the option-matrix job for what a
# configuration is and what each one is judged on.
#
# THE ARM64 LEGS. They are what exposes an x86-only assumption, and the tree
# carries the guard their absence asks for: without it src/boys_simd.cpp
# included <immintrin.h> unconditionally and CMakeLists applied
# -mavx2;-mfma;-mf16c (or /arch:AVX2) with no architecture
# guard anywhere in the tree.
# The tree now carries the guard (CMakeLists' BOYS_ARCH_X86_64 probe feeds
# BOYS_SIMD_X86 in the SIMD TU), so the arm64 legs build and run the FULL suite
# rather than being marked continue-on-error — never that, and never a deleted
# leg. What they assert is unchanged and is the point: the vector tier is
# ABSENT there, BoysAvx2Available() reports false, and the scalar lanes carry
# the twelve region entry points (see the guard's comment in src/boys_simd.cpp).
#
# Every leg runs the gate the two original legs established: build, ctest (the
# kernel contract tests, C-surface tests, boundary pins, the
# BOUNDARY-CHECK standalone over the committed reference grid, the dispatch
# assertion, and the two CONSUMER checks - a translation unit that includes
# only <boys/boys.hpp> and exercises the whole documented surface, and one that
# names what the library does not pre-instantiate and links no library
# at all), the generator byte-identity protocol (each generator's own --check
# over the committed files; the writes a regeneration makes stay local, which
# CONTRIBUTING.md states as a rule), and the
# zero-warning Doxygen build. The two original legs (windows-msvc-release,
# linux-gcc-release) keep all of it verbatim; the new x86 legs carry the same
# set so the retention is per-leg rather than workflow-wide.
#
# THE DOC-ARITHMETIC GATE is scoped to one combination with the generator and
# Doxygen steps and for the same reason: it answers a question about the
# DOCUMENTS, and its answer does not depend on the compiler or the build type,
# so one leg answers it instead of seven answering it identically. It is the
# one gate here that reads no build output at all - the documents are its
# whole input - and it is the reason the figures in them are checked rather
# than trusted. See the step for what it gates and what it deliberately only
# reports.
#
# The VERDICTS step is a reading step, not a second gate: ctest prints a test's
# output only when the test fails, so the accuracy gate's verdict and the
# consumer checks' coverage never reach the log of a green leg. The step re-runs
# those three programs with -V, which changes what is displayed and nothing
# about the verdicts (each is still its own exit status). A red leg shows the
# same output in the ctest step above, which runs with --output-on-failure.
#
# The two NEW arm64 legs (linux-arm64, windows-arm64) carry build + ctest + the
# dispatch assertion: every arm64 fact this tree has to state is a build or a
# runtime fact, and the generator and Doxygen gates are already carried by five
# legs including macos arm64 (whose job does run them — Doxygen publishes
# mac-arm assets but no Linux arm64 tarball for the pinned release). Extending
# the generator gate to linux-arm64 is a possible follow-up, not a claim made
# here. Both arm64 legs DO carry the build-facts step below: the arm64 facts are
# the ones docs/build-facts.md exists for.
#
# The BUILD FACTS step is a step on every leg that builds a binary, not a job of
# its own: the same matrix covers it, and a leg that already builds the library
# is the only thing that can state what that build is. It runs the probe under
# the leg's own check name and compares the facts against the row recorded in
# docs/build-facts.md - the target ISA, the lane widths, whether a bare a*b+c in
# this build rounds once, whether the compiled library reaches the runtime's fma
# - and fails the leg when a FACT moves. The runner's identity (processor,
# logical processors, compiler version) is a tag: reported when it moves, never
# gated, because a runner is ephemeral and the same leg draws different hardware.
# The step reads no clock. clang-tidy has no probe step because it builds no
# binary; it does tidy the probe's source, like every other source in the tree.
#
# HOW A ROW GETS INTO THE TABLE. A row is a statement about one leg's build, so
# only a run of that leg can make one, and the job log is not a file. The step
# therefore TEES the probe's stdout - the row is the first thing the probe
# prints, before it compares anything - into build-facts-row.txt, and the step
# after it uploads that file as an artifact. Ten of the twenty-two legs cannot
# print a row at all - option-plan and the clang-tidy leg build no binary and the
# eight option-matrix cells build the accuracy gate and the test suite and no
# probe - and the twelve that carry this step are the ones that can. A maintainer
# downloads those artifacts and folds each row in with
# `python tools/gen_build_facts.py --record <file>`.
#
# This is what breaks the bootstrap loop, and it is the only thing that can. The
# table starts with no CI leg's row, and `tools/gen_build_facts.py --check`
# refuses such a table rather than passing with nothing to compare - correctly,
# because a step that goes green having compared nothing is the defect. The leg
# that runs that check is a different leg from the ones that print rows, and it
# fails while the table holds no row; the probe's own step PASSES while its leg
# has no recorded row, printing the row it would record. So the run that fixes
# the table is a run like the ones that produced these artifacts, and it does not
# have to be green anywhere else: the artifacts are written by the probe steps,
# and every step after them is free to fail.
#
# Action and tool versions are pinned: checkout v7.0.1, upload-artifact v7.0.1,
# msvc-dev-cmd v1.13.0,
# mpmath 1.4.1 (requirements-boys.txt — the committed bytes only reproduce
# against it), clang-format 18.1.3 (the byte-identity gate's formatter: the
# generator must format the header with this exact formatter and must fail
# rather than skip when it finds none, or a leg's committed bytes drift from
# what it regenerates — see tools/gen_boys_coefficients.py), Doxygen 1.18.0 (the same
# release on every leg that can run it; the macOS assets are the mac-arm/
# mac-intel zips, verified to carry the same flat doxygen-1.18.0/doxygen layout
# as the Linux tarball).
#
# THE CUDA LEG COMPILES AND DOES NOT RUN. CI has no GPU runner, so what this
# leg can hold is the half of the device surface that is a PROPERTY OF THE
# SOURCE: that every CUDA translation unit compiles at the standard the library
# pins and every device target links against the kernels it was written for. It
# cannot hold a single device fact, and it does not claim one. What it does NOT
# do is stated as a step AND on the run's own summary, so a reader of the log
# cannot mistake "compiled" for "tested" (see the linux-cuda job). The device
# pins stay a documented local gate; the timed benchmark passes stay local-only
# by design (each timed run records machine, clock and commit), and every other
# leg keeps BUILD_BENCHMARKS=OFF for that reason. The one exception is the
# second tree in the CUDA leg, which turns BUILD_BENCHMARKS=ON to COMPILE the
# two CUDA drivers that live under it and never runs one.
#
# --- The dispatch assertion ------------------------------------------------
#
# Each leg asserts what BoysAvx2Available() MUST report for that architecture:
# TRUE on the x86_64 legs, FALSE on the arm64 legs. This is worth more than the
# rest of the matrix combined, because the SIMD correctness tests gate
# themselves with a soft GTEST_SKIP on that same predicate
# (tests/boys_test.cpp): a wrong CPUID bit therefore makes every SIMD test SKIP
# while CI reports green with the whole vector tier dead, which is the failure
# this assertion exists to catch. A hard assertion turns that silent
# skip into a red build. It observes the capability PREDICATE, not which path a
# given call took; that residual gap is named in the probe's own header, not
# papered over.
#
# It is ONE tracked source (tests/boys_avx2_probe.cpp) built as a CMake target
# and run by ctest, with the per-leg expectation passed as
# -DBOYS_EXPECT_AVX2=<0|1> at configure time. A heredoc pasted
# into five jobs and compiled by hand next to the library cannot inherit the
# configuration and fails for reasons that have nothing to do with AVX2: a
# hand-compiled probe misses MSVC Debug's /MDd (the leg dies on a CRT mismatch)
# and the sanitizer leg's -fsanitize flags (it dies on undefined __asan_init).
# A target that LINKS boys inherits the configuration's CRT, sanitizers and
# architecture, so there is no second flag set left to keep in step. The probe
# is built only when the option is supplied, so developer builds are unaffected.

jobs:
  # -------------------------------------------------------------------------
  # ubuntu-latest, the configuration list, read and published as the matrix.
  #
  # The library carries several certified option axes - the multiply-add route,
  # the fit family, the evaluation scheme, the interval granularity, the
  # arithmetic precision, the host - and what CI owes each of them is a
  # configuration built and judged, not one dimension of one of them. Which
  # configurations those are is DATA: .github/option-matrix.json, generated by
  # tools/gen_option_matrix.py from the library's own declarations, and this
  # job is what turns it into the `matrix:` the option-matrix job below
  # expands. Enumerating the axes in this file instead would mean rewriting it
  # every time a lane certified a member; as data, a lane regenerates it.
  #
  # The generated file is checked against the library by
  # `tools/gen_option_matrix.py --check` on the legs that carry the other
  # generated-table gates, in both directions: a configuration cannot name a
  # member this revision does not carry, and a member this revision carries
  # cannot go unaccounted for. A refusal and a matrix entry therefore cannot
  # disagree about what exists.
  #
  # This job builds nothing. It is a job rather than a step because a matrix
  # has to exist before the jobs that expand it are scheduled.
  # -------------------------------------------------------------------------
  option-plan:
    name: option-matrix (the configuration list)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the configuration list
        id: read
        run: echo "matrix=$(python3 tools/gen_option_matrix.py --emit)" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Every allowed configuration: one build of the accuracy gate and of the test
  # suite in the tree that configuration names, and both run in it.
  #
  # What a configuration is, which axes it selects and why the matrix is over
  # those, is stated where the list is generated: tools/gen_option_matrix.py.
  #
  # WHAT IS JUDGED. The accuracy gate, with the FULL suite it holds: the lane
  # book's headline is the same in every configuration by construction - its
  # bounds are the fused route's published figures and do not move with the
  # build - while the route and evaluation-scheme books are measured per
  # configuration and are expected to differ. A configuration whose books do
  # not hold exits non-zero and fails this job; the run is verbose so the
  # verdict it reached is in the log rather than behind --output-on-failure.
  #
  # AND THE TEST SUITE, in that same tree. The gate judges the figures the
  # library publishes; the suite judges the library's own contract, which
  # includes relations between two of its lanes that no reference grid states
  # and that the multiply-add route decides - the across-orders lane's split
  # Clenshaw body against the across-arguments lane's is one, and the claim
  # written for it is bit identity at the fused route against a parting no
  # wider than twice the region-A budget at the separate one
  # (tests/boys_across_orders_test.cpp). This job is the only place in the
  # workflow where the separate route is built at all, so a suite run in any
  # other leg measures the fused arithmetic under whatever name that leg
  # carries.
  #
  # NO TIMING ANYWHERE IN THIS JOB, and none anywhere in this workflow. What
  # is measured is accuracy and counts. A hosted runner is shared, ephemeral
  # and unpinned, so a duration taken on one is a distribution and not a
  # value; the timed passes are local-only by design and record the machine,
  # the clock and the commit beside each number.
  #
  # COST. Six jobs, at most four at once (max-parallel below), so this job's
  # fan-out is bounded: the free tier allows 20 concurrent jobs across every
  # repository on the account, and the legs above already claim twelve.
  # -------------------------------------------------------------------------
  option-matrix:
    name: option-matrix ${{ matrix.name }}
    needs: option-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.option-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: matrix.toolchain == 'msvc'
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF
          ${{ matrix.generator }} ${{ matrix.cmake_args }}
      - name: Build (the accuracy gate and the test suite)
        run: cmake --build build ${{ matrix.build_jobs }} --target boys-accuracy-gate boys-tests
      - name: Accuracy gate (this configuration's books)
        run: ctest --test-dir build -V -R boys-accuracy-gate
      # The suite, in this configuration's own tree. The selection is COUNTED
      # before it is run, because ctest does not fail on a filter that matched
      # nothing: measured here, `ctest -R <no match>` exits 0 on 4.2.3, and on
      # 4.4.2 without --no-tests=error. A step held only to its exit status
      # would therefore go green having run nothing, which is the failure this
      # count exists for.
      - name: Test suite (this configuration's route)
        shell: bash
        run: |
          ctest --test-dir build -N -R '^boys-tests$' | grep -qE '^Total Tests: 1'
          ctest --test-dir build --output-on-failure -R '^boys-tests$'

  # -------------------------------------------------------------------------
  # windows-latest, MSVC, Debug + Release. The original windows-msvc-release
  # job, unchanged, run for both configurations.
  # -------------------------------------------------------------------------
  windows-msvc:
    name: windows-msvc ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            expect_avx2: 1
          - build_type: Debug
            expect_avx2: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      # No Python, Doxygen or generator step on this job: the source-integrity
      # gates answer questions about the sources rather than about this leg's
      # configuration, so they run once, on the one linux-x86 combination that
      # carries them. See the note there.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }}
      - name: Build
        run: cmake --build build
      # The build's own facts, against the row docs/build-facts.md records for
      # this leg. A fact that moves - the target ISA, whether the arithmetic
      # contracts, whether the library calls the runtime's fma - fails the leg;
      # the runner's identity is reported and never gated, because a runner is
      # ephemeral. Until a leg's row is recorded the step prints the row to
      # record and passes, so a leg added here is never red for being new.
      - name: Build facts (probe vs docs/build-facts.md)
        shell: bash
        run: |
          set -o pipefail
          ./build/boys-build-facts.exe --leg "windows-msvc ${{ matrix.build_type }}" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-windows-msvc-${{ matrix.build_type }}
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      - name: Boundary standalone check
        run: |
          New-Item -ItemType Directory -Force boundary-run | Out-Null
          cl /nologo /std:c++17 /EHsc /O2 tests/boys_boundary_standalone.cpp /Fe:boundary-run\boys-boundary-check.exe /Fo:boundary-run\
          Copy-Item tests/data/boys_reference.csv boundary-run\boys_reference.csv
          Set-Location boundary-run
          .\boys-boundary-check.exe
      # The build-defaults seam read on this leg's own compiler. The step of this
      # name in linux-x86 states what it reads and why it is not a fact about the
      # sources alone: the tree it configures runs the option probe's own tests,
      # and a probe's ranking is this machine's - which entry leads a class is a
      # timing, and the two compilers this configuration now runs on have been read
      # naming different winners for the same classes. A defect that reads a winner
      # is one only the compiler that produced it can see, so the configuration
      # runs here as well as there.
      #
      # Release only, this leg's own build type and the gcc step's: the reading is
      # the compiler's, and MSVC Debug is the configuration this workflow keeps out
      # of the matrix's doubling rather than the one it needs twice.
      #
      # The configure is this leg's own with the seam flag added, on the same
      # generator and with the matrix's own AVX2 tier, so the two trees differ in
      # exactly the header the seam resolves to.
      - name: Build defaults (tuned fixture built and tested)
        if: ${{ matrix.build_type == 'Release' }}
        run: |
          cmake -S . -B build-defaults-tuned -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }} -DBOYS_BUILD_DEFAULTS=tests/build_defaults_tuned.hpp
          cmake --build build-defaults-tuned
          ctest --test-dir build-defaults-tuned --output-on-failure
      # The fit-granularity axis's third member, built and tested. The two fixtures
      # above move that axis and both name the coarsest partition, so a class resolving
      # the grid - one table over the whole of the fitted domain - was compiled by no
      # tree here and by no leg, and the umbrella's granularity lane was free to assert
      # of every partition what is true of a partition whose stored fits end at x1.
      # tests/build_defaults_uniform.hpp is that reading: ten rows' granularity cell
      # moved off the committed value and no other cell of any row, which is what makes
      # a failure under this tree the axis's rather than the build's. The ten are the
      # two host lanes' five classes each: a lane's five move together because this
      # library documents one shape's values in terms of another's, and a draft that
      # moved one of them alone failed a test whose comparison is that lane's
      # single-order and fixed-order rows.
      - name: Build defaults (the grid's row built and tested)
        if: ${{ matrix.build_type == 'Release' }}
        run: |
          cmake -S . -B build-defaults-uniform -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }} -DBOYS_BUILD_DEFAULTS=tests/build_defaults_uniform.hpp
          cmake --build build-defaults-uniform
          ctest --test-dir build-defaults-uniform --output-on-failure
  # -------------------------------------------------------------------------
  # ubuntu-latest, GCC and Clang, Debug + Release. The original
  # linux-gcc-release job, unchanged, plus Clang and the Debug configurations.
  # -------------------------------------------------------------------------
  linux-x86:
    name: linux-x86 ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    # One leg of this job carries the generator, which re-derives the committed
    # tables at full precision and is by far the longest step anywhere in the
    # matrix - the rest of this leg is about seventy seconds. A ceiling that
    # truncates it would report a real check as a failure, so this job's limit
    # is set above what that step costs rather than at the round number the
    # other jobs share.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            cc: gcc
            cxx: g++
          - compiler: gcc
            build_type: Debug
            cc: gcc
            cxx: g++
          - compiler: clang
            build_type: Release
            cc: clang
            cxx: clang++
          - compiler: clang
            build_type: Debug
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # Full history, unlike every other job here: one step below holds the
      # gate's recorded run to the revision the run names, which is an ancestor
      # of the commit being checked out. A depth-1 checkout carries neither that
      # commit nor its files, so the step could only report that it cannot tell
      # - and a check that cannot tell is not one that may pass. The repository
      # is small enough that this costs seconds.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      # The source-integrity gates below answer questions about the SOURCES:
      # whether the committed coefficient tables are what the generator
      # produces, whether the generated pages are what their generators render,
      # and whether the headers document cleanly. None of those answers depends
      # on the compiler or on the build type, so they are scoped to one
      # combination and produce their answer exactly once instead of once per
      # leg. The steps that DO depend on the configuration - the build, the
      # tests, and the build-facts probe against this leg's recorded row - are
      # left unscoped, which is what the matrix is for.
      #
      # Each of those gates also carries `always()`, and that is a second
      # condition rather than the same one: a step whose `if:` holds no status
      # function is read as `success() && <condition>`, so the matrix condition
      # alone leaves every gate AFTER the first failure of the leg SKIPPED
      # rather than red. The leg then states one finding, and its reader has no
      # way to tell the gates that agreed from the gates that never ran - the
      # answer is missing exactly when a leg has gone wrong, which is when it is
      # wanted. These gates read the sources and the workflow and nothing the
      # build makes, so there is no leg on which their answer is unavailable.
      - name: Set up Python + mpmath + clang-format (pinned)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet mpmath==1.4.1 clang-format==18.1.3 pyyaml==6.0.2
      - name: Install Doxygen 1.18.0 (pinned release)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          curl -L -sS -o /tmp/doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          echo "$(dirname "$(find /tmp/doxygen-1.18.0 -name doxygen -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1
      - name: Build
        run: cmake --build build -j 4
      # The build's own facts against this leg's recorded row: see the note in
      # the windows-msvc job for what it gates.
      - name: Build facts (probe vs docs/build-facts.md)
        run: |
          set -o pipefail
          ./build/boys-build-facts --leg "linux-x86 ${{ matrix.compiler }} ${{ matrix.build_type }}" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-linux-x86-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      # The generator re-derives the committed tables at full precision, and it
      # is the longest step anywhere in this matrix. Its inputs are the
      # generator itself and the two artefacts it produces: it reads no other
      # file, and the region boundaries it works to are its own constants rather
      # than anything it is given. So a revision touching none of those three
      # cannot have changed its answer, and re-deriving it would be proving
      # something that could not have moved.
      #
      # The default is to RUN. The skip happens only when the comparison against
      # the base revision succeeded AND the changed files it named are none of
      # the three - so an unknown base, a shallow clone or a failed fetch all
      # fall back to running the check rather than to skipping it.
      # The check asks whether the committed tables are consistent with the
      # generator. It is this command either way; what the command has to DO to
      # answer is the generator's business, and it currently re-derives the
      # tables and compares them byte for byte.
      #
      # The intended shape, which the generator does not carry yet, is that the
      # generated header records a digest of its own output and a digest of the
      # generator that produced it, so this step recomputes two hashes instead
      # of spending hours. Both halves would then be caught and they are
      # different halves: editing a coefficient by hand leaves the output digest
      # unmatched, and changing the generator without regenerating leaves the
      # generator digest unmatched.
      #
      # Either way the accuracy gate is what holds the tables themselves to their
      # measured bounds against the 45-digit reference - a wrong table is caught
      # on its merits, not by provenance - so this step is about consistency and
      # nothing else.
      - name: Generator consistency
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        env:
          CLANG_FORMAT: ${{ github.workspace }}/.venv/bin/clang-format
        run: |
          .venv/bin/python tools/gen_boys_coefficients.py --check --header include/boys/boys_coefficients.hpp --reference tests/data/boys_reference.csv
      - name: Generated tables (platform table, build-facts page, option matrix)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/gen_platform_table.py --check
          .venv/bin/python tools/gen_option_matrix.py --check
          .venv/bin/python tools/gen_build_facts.py --check
      # tests/data/boys_accuracy_gate_reference.csv is the grid every accuracy
      # claim in this tree is measured against: the CPU gate, the CUDA device
      # gate and the bounds printed beside them all read it, and no step here
      # did. It is generated, so the committed bytes are a claim about what its
      # generator produces - the same claim the four generators above make and
      # the one this file had no way to hold. A cell edited by hand, or a
      # generator changed without regenerating, moves what every lane is
      # measured against and leaves every run green; this step is what notices.
      #
      # It is the expensive generator under tools/ - a full render is 56694
      # mpmath evaluations at 80 dps - so its cost is stated rather than left to
      # be discovered: 2m20s to 2m40s end to end across two runs on the
      # development host while four other lanes were running on it, of which
      # 1m56s is the render and the rest the route agreements the generator
      # prints as its evidence that the grid is right. Both run here, on the one
      # combination the source-integrity gates above are scoped to, so the price
      # is paid once rather than on all nineteen legs.
      #
      # mpmath is what it needs, and it is this leg that installs it, pinned at
      # 1.4.1 - the version the committed bytes reproduce against. The generator
      # exits 2 when it is missing rather than skipping, because a check that
      # could not run is not a check that passed.
      - name: Accuracy gate reference (the grid against its generator)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/gen_boys_accuracy_gate_reference.py --check
      # .github/required-checks.txt is the list branch protection holds a merge
      # on, and this workflow is what reports those names. Both are written by
      # hand and every way they can part is silent: a required name no leg
      # renders leaves the merge held open for a status no job ever posts; a
      # checker under tools/ whose step was deleted, edited so it no longer
      # invokes the tool, or scoped to a leg outside the list keeps its file,
      # its green run and its reader while gating nothing; and a `--leg`
      # argument naming a leg its own job does not render feeds a comparison
      # that reports green against no row.
      #
      # This step holds the three to each other. The names are read from the
      # required list, the legs from the matrix this file carries, and the
      # checks off the tree rather than named here - so a checker is in scope
      # the moment it lands, and a pull request adding one without the step
      # that runs it fails here, on the leg that would have run it. That is the
      # failure this exists for, an instrument that exists and enforces
      # nothing, and it is the one this tool reported about itself until this
      # step was added.
      #
      # It reads the workflow, the required list and tools/ and nothing else -
      # no build, no compiler, no network - so it is scoped to one combination
      # like the gates above it.
      - name: Required checks (the names required against the checks armed)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_required_checks_are_armed.py --check
      # Every gate below this line runs on the failure of the ones above it, and
      # that is what `always()` is for here: without it the first gate to fail
      # ends the leg and the rest report nothing - the leg states one finding and
      # is read as though that were the only one there was. That is not
      # hypothetical: the step above failed on a leg whose examples check, Doxygen
      # gate and every docs gate had never been run at all, and two of those were
      # already red on committed content.
      #
      # This is the file's own idiom for a step that has to run on a leg that has
      # already failed (see the build-facts row steps, and the reason stated
      # there), and the gates below read the tree and the build this leg has
      # already made, so each answer is one a reader wants even when another gate
      # has gone red. A gate is not less true for standing beside a failure.
      # The packed orders lane is a template instantiated once per cell, and its
      # cells are written out twice - as `extern template` declarations in
      # include/boys/boys_impl.hpp and as definitions in src/boys_orders_simd.cpp.
      # A cell that falls out of one of the two lists and not the other fails
      # silently: declared and never defined is an unresolved external at a
      # consumer's link, defined and never declared is a second copy of the body
      # in every translation unit that calls it. No other gate in this file reads
      # either list, so this step is the only thing that does.
      - name: Packed orders cells (declared against instantiated)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_orders_packed_cells.py --check
      - name: Boundary standalone check
        if: ${{ always() }}
        run: |
          mkdir -p boundary-run
          g++ -std=c++17 -O2 tests/boys_boundary_standalone.cpp -o boundary-run/boys-boundary-check
          cp tests/data/boys_reference.csv boundary-run/boys_reference.csv
          cd boundary-run && ./boys-boundary-check
      # The arithmetic the published prose states over its own numbers. The
      # accuracy gate judges a bound against a delivered value, and the
      # generator gates hold the tables to theirs, so a figure that has a
      # verdict is a figure nobody has to re-derive. A DERIVED statement has no
      # such check: "a margin of 0.07 per cent", "3.06 times fewer
      # instructions", "4125493 of 5710087 cells (72.2%)" are arithmetic on
      # numbers the same sentence prints, and a reader checking one of them has
      # to do that arithmetic by hand. This step does it mechanically and fails
      # the leg when the two disagree.
      #
      # It reads Python and the documents and nothing else - no build, no
      # compiler, no network - so it is scoped to one combination like the
      # generator step above, and it is as fast as reading four files. It runs
      # --strict, which is the setting it is meant to be trusted under: a
      # mismatch in the published prose fails the leg.
      #
      # Two verdicts are reports and never fail the leg, and both are printed
      # every run rather than filtered out: "not derivable", where the sentence
      # does not print the two sides the arithmetic would need, and a mismatch
      # whose operands came from wider than the configured scope. Neither is a
      # suppression list - the material is in the log, and the line under the
      # counts says which of the two the exit status is about.
      - name: Docs (arithmetic in the published prose)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_doc_arithmetic.py --strict
      # The lane rows' `source` members are what the example programs print,
      # and the documents quote them: in a `(from ...)` beside a figure, in a
      # `[...]` in a column, and in the `bound: ...` cell of a lane-contract
      # row. A field that grows while a document keeps the text it used to
      # carry leaves the document describing output the programs no longer
      # produce, and until this step nothing read the two against each other.
      # The fp64 and fp32 rows were edited into 583- and 1123-character
      # rationale paragraphs while docs/getting-started.md kept the
      # 24-character sentence those rows had said, so the examples printed a
      # wall into a table column and the documents were quietly wrong about
      # what they print - caught then by a lane that happened to capture the
      # programs' output, not by a gate.
      #
      # This step fails the leg on a run that is the beginning of a source
      # string and stops there, and prints every other run it read as one it
      # makes no claim about: the same brackets hold the documents'
      # cross-reference labels and the same cells hold their own prose, so a
      # check that reported those would be reporting its own reader. It reads
      # the documents and src/boys.cpp and nothing else - no build, no
      # compiler, no network - so it is scoped to one combination like the
      # gates above it.
      - name: Docs (the runs the prose quotes)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_doc_transcripts.py --check
      # The accuracy gate judges every lane and region against a bound, and
      # those bounds are constants it transcribes: the block they sit in says
      # "transcribed from README.md and include/boys/boys.hpp". Nothing read the
      # two against each other until this step, so a figure edited in a document
      # and not in the gate left the gate certifying its own transcription - the
      # run green, the document's claim printed beside the gate's number.
      #
      # This step holds each transcribed constant to the cell the same fact is
      # stated in: the header's contract table, the contract row for the lane in
      # every document the tool reads, and the README's own copy of the gate's
      # printed run. Each of those documents is a place a consumer reads these
      # figures, so a table the ties are not read against is a published figure
      # nothing holds - the landing page was one, and had drifted, before the
      # tool's DOCUMENTS list named it. It then
      # names what it could not tie rather than passing over it - a constant of
      # the gate that holds a documented figure under another name fails until
      # it is tied or named, and a figure-bearing row no tie holds fails until
      # it is named with the reason it is not - so the coverage of the check is
      # a declared list and not a claim. The correspondence between the two
      # tables is not one to one and the tool says which ties are set-level for
      # that reason.
      #
      # It reads the three documents, the gate and src/boys.cpp and nothing
      # else - no build, no compiler, no network - so it is scoped to one
      # combination like the gates above it, and it is as fast as reading five
      # files.
      - name: Docs (the bounds the gate transcribes)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_bound_transcripts.py --check
      # The step above holds the README's printed-run table to the gate's
      # recorded run, and a run is a record of one revision: taken before a
      # change to the library, it still satisfies that tie while the document
      # states figures this tree's gate may no longer print. This step is the
      # other half - the record against the code - and it reads the revision out
      # of the run and asks git what has changed since, over the files the gate
      # prints from. It cannot see a difference only a build would show, and it
      # says so; what it can see is a record of a tree that has moved.
      - name: Docs (the gate's recorded run, against this revision)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_recorded_run.py
      # The two consumer documents quote what the examples print, and nothing read those runs back:
      # the ctest legs run every example (`boys-example-*`) and compare nothing, and no tool read an
      # example's stdout at all - so a change that moved a printed digit left README.md and
      # docs/getting-started.md quoting a figure no program prints any more, with every leg green.
      #
      # This step is the reading. The programs come out of the build this job has just made, by the
      # directory CMake resolves them into, and each quoted run is compared against what its program
      # printed. The association between a run and its program is read out of the documents' own
      # structure - the section that names the example, the block the document presents as a run -
      # and a block that cannot be associated with a program fails this step too, because that is
      # how a check like this goes quiet. (tools/check_required_checks_are_armed.py reads this step
      # as the one that arms this tool.)
      #
      # One block is named and not compared: examples/07_option_probe.cpp times its own run against
      # the host's clock, and the document says of that block that every figure in it is a property
      # of this host and this run, so the tool reports it by name rather than comparing it.
      # Scoped to a build that does not contract the multiply-add, because the quoted figures are
      # such a build's. Measured on CI rather than assumed: every Release leg on gcc, clang and macOS
      # failed this test on the last digit of F_3(1.25), while every Debug leg passed and MSVC passed
      # at both - Release contracts, Debug does not, and MSVC does not at these settings. A document
      # cannot be checked against a build it does not describe, so this runs where the figures came
      # from. It is deliberately NOT loosened to a tolerance: that would stop it catching a stale
      # figure, which is the only thing it is for. The ctest registration carries the same scope.
      # `python3`, not the venv's interpreter: this tool imports stdlib only, and the venv is set up
      # on the gcc Release leg alone (`if:` on the "Set up Python" step above). Naming
      # `.venv/bin/python` here exits 127 - command not found - because on a Debug leg there is no
      # venv at all, which is what the first version of this step did on CI run 3.
      - name: Examples (the runs the two documents quote)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Debug' }}
        run: |
          python3 tools/check_example_transcripts.py --check --examples-dir build
      # The build-defaults seam offered a consumer five choices when this step was
      # added - it offers seven now, the host's five and the device lane's two - and
      # until this step nothing checked that the library reads them. Three of the five were
      # read by nothing at all - the packing axis, the division form and the fit
      # granularity compiled hard-coded literals - so a consumer who replaced
      # the seam header got two choices honoured and three silently ignored, and
      # the tuned fixture could not notice because it moved the scheme and
      # copied the library's own values for the other four.
      #
      # This step reads the macro names off the seam file and requires each to be
      # expanded somewhere in include/ or src/. It does not check that a reader
      # is correct, or that the axis can be moved at all: those are compile-time
      # facts, and a build that moves an axis and fails is the reading for them.
      # It is the cheap half - a choice that stops being read at all, which is
      # the half that goes quiet.
      - name: Docs (the choices the build-defaults seam offers)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_seam_macros.py --check
      # The same seam read the expensive way, and the half the step above cannot
      # supply: that a macro is expanded somewhere in include/ or src/ is a text
      # fact, while whether the value it names is the value an entry that names no
      # policy resolves to is a compile-time one, and a build that moves an axis is
      # the only reading for it. tests/build_defaults_tuned.hpp is that build's
      # header: it moves the evaluation scheme, the division form and the fit
      # granularity off the shipped values, and tests/boys_backend_test.cpp pins
      # all five against it, so an axis whose reader stops being reached resolves
      # the shipped value and fails this leg rather than passing quietly. The three
      # axes that once sat in the seam file named, documented and expanded by
      # nothing are what this exists for: the fixture could not see them, because
      # it copied the library's own values for the four it did not move.
      #
      # A second configure in a second build directory rather than a leg or a job
      # of its own. Whether the library reads the choices it declares is a fact
      # about the SOURCES, and that half is the same on every compiler - which is
      # why the generator, generated-tables, packed-orders and docs steps above are
      # scoped to the same one combination. The suite this configure builds is not
      # all of that half: it carries the option probe's own tests
      # (tests/boys_probe_test.cpp), and the probe's report is, in CMakeLists' own
      # words for the probe's driver, a property of the host and the clock - so the
      # ranking those tests assert on is this leg's build on this leg's machine.
      # Two probe runs, one on each of the two compilers this configuration now
      # runs on, reported the same structure - 20 classes, 585 measurements, 144
      # ranked cells in each all-orders class - and named different winners: all
      # four all-orders classes, and the report's own recommendation with them. The
      # block's own text is the same on both compilers, and this leg reads it; a
      # defect that reads a winner is one only the compiler that produced it can
      # see, so the configuration is carried on the MSVC Release leg beside this one
      # (the step of this name in windows-msvc, on that leg's own configure line).
      #
      # It also leaves the leg list alone, and that list is what README's platform
      # table is generated from (tools/gen_platform_table.py --check, run above).
      #
      # The configure is this leg's own with one flag added, so the two trees
      # differ in exactly the header the seam resolves to and the same suite is
      # the reading of the difference. The dispatch-assertion option is carried
      # rather than dropped for that reason: a second tree registering one fewer
      # test than the tree beside it would be a configuration nobody declared.
      - name: Build defaults (tuned fixture built and tested)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          cmake -S . -B build-defaults-tuned -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1 \
            -DBOYS_BUILD_DEFAULTS=tests/build_defaults_tuned.hpp
          cmake --build build-defaults-tuned -j 4
          ctest --test-dir build-defaults-tuned --output-on-failure
      # The granularity axis's third member, for the reason the same step in
      # windows-msvc states: two fixtures move that axis and both name the coarsest
      # partition, so a class resolving the grid - one table over the whole fitted
      # domain, its end past x1 by design - was compiled by nothing, and the umbrella's
      # granularity lane stated of every partition what holds only of one whose stored
      # fits end at x1. Ten rows' granularity cells are the whole of what this fixture
      # moves - the two host lanes' five classes each, a lane's five together for the
      # reason the same step in windows-msvc states - so a failure under this tree is
      # the axis's and not the build's.
      - name: Build defaults (the grid's row built and tested)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          cmake -S . -B build-defaults-uniform -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1 \
            -DBOYS_BUILD_DEFAULTS=tests/build_defaults_uniform.hpp
          cmake --build build-defaults-uniform -j 4
          ctest --test-dir build-defaults-uniform --output-on-failure
      # The device surface is described by five hand-written lists and nothing
      # reconciled them, so they disagreed: four rows of the option enumeration
      # named entries that had never been declared in any commit - and they
      # carried report rows with bounds and
      # built = true, were launched by the measurement tool through a twin's
      # launcher, and were claimed by the accuracy gate, four mechanisms consumed
      # the description without one asking whether the entry was there.
      #
      # This step is the bijection between the two lists a caller meets: every row
      # of the enumeration names a member the class declares, and every declared
      # member is booked by a row. Both directions are defects - a row with no
      # member is an option the library advertises and cannot deliver, and a
      # member with no row is an entry no book describes or counts.
      - name: Device (the options booked against the entries declared)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_device_entry_bijection.py --check
      # The host surface had the same exposure one layer up, and no step read it:
      # the names three headers declare and the shapes tools/host-shapes.json
      # places them in were both written by hand and nothing reconciled them, so a
      # shape nothing reaches read exactly like a shape this surface has.
      #
      # This step is the bijection between the two lists a caller meets, in both
      # directions: a declared name the table does not place is a call whose shape
      # nothing states, and a name the table places that no header declares is a
      # shape described for a call that does not exist, which a later reader takes
      # for a decision. The names are read from the headers rather than from a
      # second list, so the table cannot agree with itself while disagreeing with
      # the code.
      - name: Host (the shapes booked against the names declared)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_host_entry_bijection.py --check
      # The bijection above has the shape as its unit, and a shape is served when
      # any precision has an entry for it - so a class the library's enumerations
      # imply and no header declares is not a shape that is missing, it is a shape
      # that is present at another precision. This step walks the Precision-by-Shape
      # cross the header declares and requires every cell to be served by an entry
      # or to carry a stated reason in the table's `absent` list. A reason is
      # admissible only for a proved impossibility, so the list being empty is the
      # statement that the cross is served.
      - name: Host (every class the enumerations imply)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_class_surface.py --check
      # The device half has the same exposure in its own key, and neither step
      # above reaches it: that check walks the host cross, and the device
      # bijection has the entry as its unit - so a precision the option table
      # carries rows for at two questions and none at the third reads complete
      # from inside every list being read, and the entry each of its rows names
      # is declared. This step walks the DeviceOptionPrecision-by-
      # DeviceOptionQuestion cross the options header declares, which is the key
      # src/boys_cuda_probe.cpp counts a class by and the one its build-defaults
      # emission writes a row's shape cell from, and requires every cell to be
      # carried by a row of the option table or refused by every row with a
      # reason the row itself states. It reads two files and nothing else - no
      # build, no compiler, no CUDA toolkit - so it is scoped to this
      # combination like the three steps above it.
      - name: Device (every class the enumerations imply)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_device_class_surface.py --check
      # The defaults table is the third hand-written list read against the entries
      # themselves, and until this step nothing read it: a row for a class no entry
      # reaches is a default a caller cannot ask for, and it is invisible - the
      # table reads complete, and the only symptom is that the class cannot be
      # called. Every build break of 2026-10-02 came from two of these three lists
      # disagreeing while each read correct from inside the list being read.
      #
      # This step is the bijection the header's own prose states, in both
      # directions: a row whose class no entry names is a class the library does
      # not offer, and an entry naming an unrowed class is one the build refuses
      # anyway, so seeing it here means the two lists were read differently.
      #
      # It reads include/boys/boys_build_defaults.hpp and the three public headers
      # and nothing else - no build, no compiler, no network - so it is scoped to
      # one combination like the two steps above it.
      - name: Defaults (the rows booked against the entries declared)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_default_rows_have_entries.py
      # The option space closes in three places and only one of them is a property
      # this checkout can settle on its own: the host space closes from the
      # accuracy gate's recorded run, which is committed, while the device and
      # probe spaces close from the option probes' own reports - and those reports
      # are what a probe run for keeps PRODUCES. A step that waited for all three
      # would be waiting for the thing it guards, so this one reads the half that
      # is a precondition and leaves the other half to be judged after the run
      # that makes it. What it reads is the recorded run's own printed arithmetic,
      # so a run that stops printing it fails here rather than passing quietly.
      - name: Host (every member of the option space accounted for and certified)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_host_space_closes.py
      # A conditional that opens a construct and closes it outside its own branch
      # compiles on the configuration its author is building and fails on every
      # other one: an `#if` around a `namespace {` that closes after the `#endif`
      # is balanced on the branch that took the `#if`, and the branch that did not
      # sees an unbalanced brace. Five arm64 legs went red on exactly that shape,
      # so the balance is read here rather than left to whichever targets happen
      # to be built.
      - name: Sources (a construct a conditional opens is closed inside it)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_conditional_spans.py --check
      # The scheme arms have the same exposure one layer down, and no compiler sees
      # all of it. gcc and clang catch an arm the switch is missing through
      # -Wswitch, but only while the switch has no `default` arm, and a switch that
      # keeps one for the values cast in from outside the enumeration swallows a
      # new enumerator exactly as quietly. MSVC emits nothing for an unhandled
      # enumerator at /W4 either way, and it is the toolchain the release is
      # verified on.
      #
      # This step is the compiler's own rule applied to every switch uniformly:
      # every enumerator of OrdersScheme is named as an arm of every switch that
      # dispatches on it. An arm list stopping short of one is not a crash - each
      # of those switches falls through to the certified sum - so the caller is
      # handed a different option from the one it named, silently, and the probe
      # books the cell as measured.
      - name: Arms (every scheme named by every switch over it)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_enum_arms_covered.py --check
      # The device probe accounts for its rows from the library's own option table,
      # which the library asserts is one row per DeviceEntry in enumerator order -
      # so the accounted space and the enumeration cannot disagree without the
      # library failing to compile. What can still disagree is whether a row can be
      # MEASURED: the probe reaches an entry through a hand-written switch in its
      # own CUDA translation unit, one switch for the launched family and one for
      # the device-callable one, and an entry no arm reaches takes that switch's
      # default and produces no figure. The row is then offered, owed a place by
      # the closure and reported with nothing in it, which reads as a card the
      # entry is slow on rather than as an arm that was never written.
      #
      # This step is the three sets reconciled by name: the enumeration, the rows
      # of kDeviceOptions, and the probe's own arms with the preprocessor guard
      # each sits under - because an arm behind `#if BoysFp16` is the seam's, and
      # the rows it must cover are the ones whose own built cell is that seam's
      # constant. Both directions are defects: an unarmed row is unmeasurable, and
      # an arm naming an entry the enumeration does not declare is a switch arm for
      # an option that does not exist.
      #
      # It reads three source files and nothing else - no CUDA build, no compiler,
      # no card - so the CUDA lane's absence from a leg does not leave this unrun.
      - name: Device probe (every declared entry armed in the probe's own dispatch)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/check_device_probe_measures_every_entry.py --check
      - name: Docs (zero-warning Doxygen gate)
        if: ${{ always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: cmake --build build --target boys-docs
  # -------------------------------------------------------------------------
  # ubuntu-latest, AddressSanitizer + UndefinedBehaviorSanitizer. For kernel
  # code this is the highest value per minute on the board: the region
  # partitioning, the 4-lane vector tails and the padded coefficient tables are
  # exactly where an out-of-bounds or a signed-overflow would live.
  # -------------------------------------------------------------------------
  linux-sanitizers:
    name: linux-sanitizers asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 4
      # The probe is built and run under the sanitizers like everything else
      # here, so this leg also states that reading the build's own facts is
      # clean under them.
      - name: Build facts (probe vs docs/build-facts.md)
        run: |
          set -o pipefail
          ./build/boys-build-facts --leg "linux-sanitizers asan+ubsan" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-linux-sanitizers
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion, under the sanitizers)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
  # -------------------------------------------------------------------------
  # ubuntu-24.04-arm, GCC. NEON vs AVX2: this catches x86-only assumptions.
  # The AVX2 tier is absent by construction, and the leg still
  # builds and runs the full suite.
  # -------------------------------------------------------------------------
  linux-arm64:
    name: linux-arm64 gcc Release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=0
      - name: Build
        run: cmake --build build -j 4
      # This leg's row is the arm64 statement: the target ISA the build names,
      # whether the arithmetic contracts, and what the library's own report says
      # about the multiply-add it carries. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        run: |
          set -o pipefail
          ./build/boys-build-facts --leg "linux-arm64 gcc Release" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-linux-arm64
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
  # -------------------------------------------------------------------------
  # windows-11-arm, MSVC arm64.
  #
  # The arch must be stated explicitly rather than left to the action's
  # default: ilammy/msvc-dev-cmd defaults to host=x64, so a leg that inherits
  # it builds an x64 binary and runs it under Windows' x64 emulation on the
  # ARM64 runner. It reports BoysAvx2Available() = true, correctly — for an
  # x64 build — which is a green-looking leg with no arm64 subject at all.
  # -------------------------------------------------------------------------
  windows-arm64:
    name: windows-arm64 msvc Release
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: arm64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=0
      - name: Build
        run: cmake --build build
      # The arm64 MSVC row. The probe reads no CPUID here - the target has none,
      # and the build would not compile if it asked - so the processor line is
      # the operating system's report. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        shell: bash
        run: |
          set -o pipefail
          ./build/boys-build-facts.exe --leg "windows-arm64 msvc Release" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-windows-arm64
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'

  # -------------------------------------------------------------------------
  # macOS, AppleClang: macos-latest is Apple Silicon (arm64 — the AVX2 tier is
  # absent there, asserted as such) and macos-15-intel is the x64 runner that
  # actually has AVX2.
  # -------------------------------------------------------------------------
  macos:
    name: macos ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: arm64
            doxygen_asset: doxygen-1.18.0-mac-arm.zip
            expect_avx2: 0
          - runner: macos-15-intel
            label: x64
            doxygen_asset: doxygen-1.18.0-mac-intel.zip
            expect_avx2: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      # No Python, Doxygen or generator step on this job: the source-integrity
      # gates answer questions about the sources rather than about this leg's
      # configuration, so they run once, on the one linux-x86 combination that
      # carries them. See the note there.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }}
      - name: Build
        run: cmake --build build -j 3
      # Both macOS rows: the arm64 one states the arm64 facts and the x64 one
      # whether std::fma survives as a call on a target that has the
      # instruction. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        run: |
          set -o pipefail
          ./build/boys-build-facts --leg "macos ${{ matrix.label }}" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-macos-${{ matrix.label }}
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      - name: Boundary standalone check
        run: |
          mkdir -p boundary-run
          c++ -std=c++17 -O2 tests/boys_boundary_standalone.cpp -o boundary-run/boys-boundary-check
          cp tests/data/boys_reference.csv boundary-run/boys_reference.csv
          cd boundary-run && ./boys-boundary-check
  # -------------------------------------------------------------------------
  # ubuntu-latest, clang-tidy over the project's own compile database.
  #
  # A leg of its own, not a step on a build leg: a tidy failure has to be
  # attributable to tidy. The project rule applies verbatim — tidy issues are first
  # reported LOCALLY, and CI is the backstop — so the gate here is the FAILURE
  # MODE of a tidy run rather than its findings: zero `error:` diagnostics and
  # no "Error while processing" line, i.e. every TU parsed. The baseline check
  # set in .clang-tidy prints its findings into the log for the author.
  #
  # boys has no PCH (CMakeLists: "No PCH in this tree"), so the compile
  # database is self-sufficient and no materialise-the-PCHs step is needed.
  # No external tidy script is imported: a tool that assumes another tree's
  # layout is the defect class this project keeps finding. This uses boys'
  # own database instead.
  # -------------------------------------------------------------------------
  clang-tidy:
    name: linux-x86 clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure (compile database)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy over the library and test TUs
        run: |
          clang-tidy --version
          python3 - <<'PY' > /tmp/tidy-sources.txt
          import json, pathlib
          db = json.load(open("build/compile_commands.json"))
          for entry in db:
              path = pathlib.Path(entry["file"]).resolve()
              if "third_party" in path.parts:
                  continue
              print(path)
          PY
          : > tidy.log
          while read -r src; do
            echo "=== clang-tidy ${src}" | tee -a tidy.log
            clang-tidy -p build "${src}" >> tidy.log 2>&1 || true
          done < /tmp/tidy-sources.txt
          echo "--- findings ---"
          grep -E "warning:|error:" tidy.log | head -50 || true
          if grep -qE ": error:|Error while processing" tidy.log; then
            echo "clang-tidy could not process every TU: the run is not usable."
            exit 1
          fi
          echo "clang-tidy: every TU parsed, no error: diagnostics"

  # -------------------------------------------------------------------------
  # THE CUDA LEG, WHICH COMPILES THE DEVICE SOURCES AND RUNS NO KERNEL.
  #
  # WHY IT EXISTS. Every other leg configures with -DBUILD_CUDA=OFF, so before
  # this one not one of the six CUDA translation units in this tree
  # (src/boys_cuda.cu, src/boys_cuda_probe_kernels.cu, the two consumer kernels
  # tests/boys_cuda_device_demo.cu and tests/boys_cuda_route_test.cu, the
  # consumer default check's tests/consumer_cuda_defaults.cu, and the benchmark
  # driver's benchmarks/boys_cuda_benchmark_kernels.cu) and not one of the
  # host-side translation units that include the toolkit's headers for them
  # (src/boys_cuda.cpp, src/boys_cuda_probe.cpp, tests/boys_cuda_test.cpp,
  # tests/boys_cuda_probe_test.cpp, the two device gate TUs, the consumer
  # default check's host half and the two benchmark drivers) had ever been
  # compiled by CI at all. A file that does not parse, a header the toolkit does
  # not have, a language standard the toolkit refuses, a launcher whose kernel
  # signature moved: each of those was a red build that no leg could ever
  # report, for as long as it took a person to build the lane locally.
  #
  # WHAT A GPU RUNNER WOULD ADD, AND WHAT THIS LEG IS INSTEAD. CI has no GPU
  # runner, so this leg holds the half of the device surface that is a property
  # of the SOURCE rather than of a card: that the device translation units
  # compile, and that every device target links against the kernels it was
  # written for. It holds no device fact. It runs no kernel, measures no
  # duration, and compares no figure against the committed reference grid. A
  # green run of this leg says the device sources are COMPILED; it says nothing
  # whatever about what they compute. The device pins stay a documented local
  # gate, unchanged, and so do the timed passes.
  #
  # WHAT IT RUNS, AND WHY EXACTLY THAT. The probe's own test binary is the one
  # device target carrying tests that are device-free, and which those are is
  # read off the source rather than guessed at:
  #   * RunDeviceOptionProbe returns a status BEFORE it touches a device - a
  #     runtime that cannot report a count, a count of zero, and a device index
  #     past the count each return kDeviceError, kNoDevice and kDeviceNotFound,
  #     with a failure string and no classes and no measurements
  #     (src/boys_cuda_probe.cpp, RunDeviceOptionProbe);
  #   * the space and closure tests build their reports from the library's own
  #     tables (BoysDeviceOptions(), BoysDivisionForms()) and take the probe's
  #     rendering of them, so they need no card and no clock
  #     (tests/boys_cuda_probe_test.cpp).
  # The six names below are those tests, and the count is asserted, because a
  # filter that matched nothing exits zero and this step must not be a green
  # step that ran nothing. Everything else in that binary needs a card, and so
  # does every other device target: boys-cuda-tests exits ZERO having executed
  # none of its seventeen tests (every one is a soft GTEST_SKIP of "no CUDA
  # device", tests/boys_cuda_test.cpp), so running it here would report a suite
  # that did not run, and boys-consumer-cuda-defaults, boys-cuda-route-tests and
  # boys-cuda-accuracy-gate each exit non-zero with "no usable device".
  #
  # THE SECOND TREE. benchmarks/boys_cuda_benchmark_kernels.cu and
  # benchmarks/boys_device_probe.cpp are CUDA translation units too, and they
  # live under BUILD_BENCHMARKS, which every leg keeps OFF because the TIMED
  # passes are local-only by design. This leg turns it on in a tree of its own
  # to COMPILE those two drivers, and runs neither of them: what is local-only
  # about a benchmark is its timing, and a compiled driver takes no timing.
  # -------------------------------------------------------------------------
  linux-cuda:
    name: linux-cuda compile-only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      # The scope as a step and not only as the comment above, so that it is in
      # the log of every run this leg makes rather than only in the file.
      - name: Scope (what this leg proves, and what it does not)
        run: |
          cat <<'EOF'
          =========================================================================
          SCOPE OF THIS LEG: COMPILED, NOT TESTED.
          =========================================================================
          This runner has no GPU. What a green run of this leg proves is a
          property of the SOURCE:
            COMPILED  every CUDA translation unit in the tree, at the language
                      standard the library pins for it, by the pinned toolkit.
            LINKED    every device target, against the kernels it calls.
            RUN       six tests of the probe's own suite, the ones the source
                      says are device-free. They assert the shape of a report
                      and the status an absent device returns; none of them
                      reads a clock or touches a card.
          What it does NOT do, and does not claim: run a kernel, measure a
          duration, compare a device figure against the committed reference
          grid, or exercise any device entry point. The device bounds are a
          documented local gate and this leg is not a substitute for it.
          A failure here means the device source does not build. A pass here
          means nothing about what the device code computes.
          =========================================================================
          EOF
      # The toolkit, from NVIDIA's own apt repository. Two packages rather than
      # the cuda-toolkit metapackage: cuda-compiler-13-3 carries nvcc, and
      # cuda-cudart-dev-13-3 carries every header this tree includes
      # (cuda_runtime.h, cuda_fp16.h and cuda.h are all that package's) and
      # libcudart. No driver package and no device: nvcc compiles device code
      # with no card present, which is the whole reason this leg can exist.
      #
      # The repository path is derived from the image instead of written down:
      # ubuntu-latest has moved release before, and a hardcoded ubuntu2404 turns
      # that into a leg that fails inside apt rather than inside the code it is
      # here to check. The toolkit version IS pinned - 13.3 is the version this
      # lane is built and verified against locally, and the version the probe's
      # report names as the toolkit that compiled the kernels.
      - name: CUDA toolkit 13.3 (nvcc and the runtime; no driver, no card)
        run: |
          set -euo pipefail
          ubuntu="$(. /etc/os-release && echo "${VERSION_ID//./}")"
          curl -fsSL -o /tmp/cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${ubuntu}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-compiler-13-3 cuda-cudart-dev-13-3
          # A partial install creates no /usr/local/cuda alternatives link, so
          # nvcc is put on PATH for the steps below: CMake finds the toolkit
          # from the compiler it finds, and the include and library paths the
          # device targets need follow from that one fact.
          echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-13.3/bin/nvcc --version
      - name: Configure (BUILD_CUDA=ON)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=ON
      # The whole default target set, not a list of the device targets: with the
      # CUDA lane on, the CPU accuracy gate and the CUDA consumer target link
      # boys-cuda and compile against the toolkit's headers too, so what a
      # device target can break is not confined to the device targets.
      - name: Build (every CUDA translation unit, every device target)
        run: cmake --build build -j 4
      # The build's own facts against this leg's recorded row: see the note in
      # the windows-msvc job for what it gates.
      - name: Build facts (probe vs docs/build-facts.md)
        run: |
          set -o pipefail
          ./build/boys-build-facts --leg "linux-cuda compile-only" --check docs/build-facts.md | tee build-facts-row.txt
      # The row this leg just printed, as a file: the capture `--record` reads.
      # `always()` because the row is most wanted on a run whose probe failed -
      # a fact that moved is a row to re-record, not one to lose.
      - name: Build facts row (the block to record)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-facts-row-linux-cuda
          path: build-facts-row.txt
          if-no-files-found: ignore
          retention-days: 30
      # The six device-free tests, by name. See the job comment for how the list
      # was established; the counted line below is what keeps a filter that
      # matched nothing from being a green step.
      - name: Device-free probe tests (the six that need no card)
        run: |
          set -o pipefail
          ./build/boys-cuda-probe-tests \
            --gtest_filter='DeviceProbe.ACanaryThatDidNotRunIsNotAQuietCanary:DeviceProbe.AnAbsentDeviceIsAStatusAndNotACrash:DeviceProbe.ARowIsServedOrRefusedAndTheSpaceIsCountedFromTheRows:DeviceProbe.TheClosurePutsEveryMemberOfTheSpaceInOneState:DeviceProbe.AClosureOverARunThatMeasuredNothingFails:DeviceProbe.ARequestForOneEntryIsClosedWithTheRestOfTheSpaceStated' \
            | tee cuda-tests-without-a-card.txt
          grep -q '^\[  PASSED  \] 6 tests\.$' cuda-tests-without-a-card.txt
      # The two CUDA drivers that live under BUILD_BENCHMARKS, COMPILED and
      # never run. A separate tree because turning benchmarks on in the tree
      # above would build every timing harness here, which is not what this leg
      # is for; BOYS_BUILD_TESTS=OFF because the library and its two drivers are
      # the whole of what this tree is asked to produce.
      - name: CUDA benchmark drivers (compiled, never run)
        run: |
          cmake -S . -B build-drivers -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CUDA=ON -DBUILD_BENCHMARKS=ON -DBOYS_BUILD_TESTS=OFF
          cmake --build build-drivers -j 4 --target boys-cuda-benchmark boys-device-probe
      # The device targets as files, which is what "linked" means: a target that
      # was configured but not linked is a file that is not here, and `ls` fails
      # on one of those. `always()` so a red build still reports which of them
      # got as far as being produced.
      - name: What was built (the device targets, as files)
        if: always()
        run: |
          ls -l build/boys-cuda-tests \
                build/boys-cuda-tests-divform-control \
                build/boys-cuda-probe-tests \
                build/boys-cuda-accuracy-gate \
                build/boys-consumer-cuda-defaults \
                build/boys-cuda-route-tests \
                build-drivers/boys-cuda-benchmark \
                build-drivers/boys-device-probe
