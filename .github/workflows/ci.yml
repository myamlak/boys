name: CI

on:
  push:
    branches: [main]
  # Required status checks are reported on pull requests only when the workflow
  # runs on pull_request: a checks-only branch-protection rule over a
  # push-triggered workflow would block every PR on checks that never appear.
  # This trigger is therefore load-bearing for the protection rule on main, not
  # a convenience.
  pull_request:
    branches: [main]

# Cancel a still-running older run when a newer push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Coverage policy -------------------------------------------------------
#
# boys is a PUBLIC repository, so GitHub gives it unlimited free standard-runner
# minutes AND double the machine: the same label is 4 vCPU / 16 GB here rather
# than the 2 vCPU / 8 GB of the reduced tier. The direction is deliberate: boys
# gets the fullest coverage standard runners allow.
#
# STANDARD HOSTED LABELS ONLY (windows-latest, windows-11-arm, ubuntu-latest,
# ubuntu-24.04-arm, macos-latest, macos-15-intel). Larger runners are billed
# and would break the free assumption — never add one here.
#
# boys is a numeric kernel library with an AVX2/FMA gate and an fp16 seam, so
# architecture and sanitizer coverage is where its risk actually lives:
#
#   windows-latest    MSVC   Debug + Release   (the verified toolchain)
#   windows-11-arm    MSVC   Release           (arm64 — see the note below)
#   ubuntu-latest     GCC    Debug + Release   (the verified toolchain)
#   ubuntu-latest     Clang  Debug + Release   (the -ffp-contract class)
#   ubuntu-latest     ASan+UBSan               (highest value per minute here)
#   ubuntu-24.04-arm  GCC    Release           (arm64 — see the note below)
#   macos-latest      AppleClang Release       (arm64 — see the note below)
#   macos-15-intel    AppleClang Release       (x64: macos-latest is Apple Silicon)
#
# FULL SUITE ON EVERY LEG, Debug and Release alike. No fast-subset rule
# applies here: such a rule exists for MSVC-side cost (MSVC Debug is 10-50x
# the Release cost of the heavy suites, where Linux Debug is only ~2x), and a
# build-only Debug leg would never execute the nine assert(BoysAvx2Available())
# sites — precisely what a Debug leg is for. boys' suite is small (~50 tests,
# 4096-element sweeps) and its minutes are free, so the cost reasoning does not
# arise.
#
# THE OPTION MATRIX is separate from the platform legs above and answers a
# different question: not "does this platform build" but "does each certified
# configuration of the library hold its own books". It was one extra dimension
# carried as an ad-hoc step inside two legs - a second tree built with
# BOYS_MULADD_SEPARATE=ON and the accuracy gate run in it - and a step is the
# wrong shape for what is now an axis-crossed list: it could only ever measure
# one axis, on the two legs that happened to carry it, and a member added to
# any axis landed where CI could not see it. The configurations are data
# (.github/option-matrix.json), the workflow expands them, and a member is
# added by regenerating that file. See the option-matrix job for what a
# configuration is and what each one is judged on.
#
# THE ARM64 LEGS. They were added RED on purpose and they earned their keep on
# the first run: src/boys_simd.cpp included <immintrin.h> unconditionally and
# CMakeLists applied -mavx2;-mfma;-mf16c (or /arch:AVX2) with no architecture
# guard anywhere in the tree, which is the finding those legs exist to expose.
# The tree now carries the guard (CMakeLists' BOYS_ARCH_X86_64 probe feeds
# BOYS_SIMD_X86 in the SIMD TU), so the arm64 legs build and run the FULL suite
# rather than being marked continue-on-error — never that, and never a deleted
# leg. What they assert is unchanged and is the point: the vector tier is
# ABSENT there, BoysAvx2Available() reports false, and the scalar lanes carry
# the twelve region entry points (see the guard's comment in src/boys_simd.cpp).
#
# Every leg runs the gate the two original legs established: build, ctest (the
# kernel contract tests, multiplier tests, C-surface tests, boundary pins, the
# BOUNDARY-CHECK standalone over the committed reference grid, the dispatch
# assertion, and the two CONSUMER checks - a translation unit that includes
# only <boys/boys.hpp> and exercises the whole documented surface, and one that
# names multipliers the library does not pre-instantiate and links no library
# at all), the generator byte-identity protocol (no-args in-place regeneration
# + --check + git diff --exit-code over the two generated files), and the
# zero-warning Doxygen build. The two original legs (windows-msvc-release,
# linux-gcc-release) keep all of it verbatim; the new x86 legs carry the same
# set so the retention is per-leg rather than workflow-wide.
#
# The VERDICTS step is a reading step, not a second gate: ctest prints a test's
# output only when the test fails, so the accuracy gate's verdict and the
# consumer checks' coverage never reach the log of a green leg. The step re-runs
# those three programs with -V, which changes what is displayed and nothing
# about the verdicts (each is still its own exit status). A red leg shows the
# same output in the ctest step above, which runs with --output-on-failure.
#
# The two NEW arm64 legs (linux-arm64, windows-arm64) carry build + ctest + the
# dispatch assertion: every arm64 fact this tree has to state is a build or a
# runtime fact, and the generator and Doxygen gates are already carried by five
# legs including macos arm64 (whose job does run them — Doxygen publishes
# mac-arm assets but no Linux arm64 tarball for the pinned release). Extending
# the generator gate to linux-arm64 is a possible follow-up, not a claim made
# here. Both arm64 legs DO carry the build-facts step below: the arm64 facts are
# the ones docs/build-facts.md exists for.
#
# The BUILD FACTS step is a step on every leg that builds a binary, not a job of
# its own: the same matrix covers it, and a leg that already builds the library
# is the only thing that can state what that build is. It runs the probe under
# the leg's own check name and compares the facts against the row recorded in
# docs/build-facts.md - the target ISA, the lane widths, whether a bare a*b+c in
# this build rounds once, whether the compiled library reaches the runtime's fma
# - and fails the leg when a FACT moves. The runner's identity (processor,
# logical processors, compiler version) is a tag: reported when it moves, never
# gated, because a runner is ephemeral and the same leg draws different hardware.
# The step reads no clock. clang-tidy has no probe step because it builds no
# binary; it does tidy the probe's source, like every other source in the tree.
#
# Action and tool versions are pinned: checkout v7.0.1, msvc-dev-cmd v1.13.0,
# mpmath 1.4.1 (requirements-boys.txt — the committed bytes only reproduce
# against it), clang-format 18.1.3 (the byte-identity gate's formatter: the
# generator used to format the header with whatever clang-format it found on
# PATH and to skip silently when it found none, which is how the macos leg
# drifted — see tools/gen_boys_coefficients.py), Doxygen 1.18.0 (the same
# release on every leg that can run it; the macOS assets are the mac-arm/
# mac-intel zips, verified to carry the same flat doxygen-1.18.0/doxygen layout
# as the Linux tarball).
#
# There is deliberately no CUDA leg: CI has no GPU runner, the device pins are
# a documented local gate, and the timed benchmark passes stay local-only by
# design (each timed run records machine, clock and commit). The
# CMake benchmark targets are therefore off in CI (BUILD_BENCHMARKS=OFF).
#
# --- The dispatch assertion ------------------------------------------------
#
# Each leg asserts what BoysAvx2Available() MUST report for that architecture:
# TRUE on the x86_64 legs, FALSE on the arm64 legs. This is worth more than the
# rest of the matrix combined, because the SIMD correctness tests gate
# themselves with a soft GTEST_SKIP on that same predicate
# (tests/boys_test.cpp): a wrong CPUID bit therefore makes every SIMD test SKIP
# while CI reports green with the whole vector tier dead — the exact failure
# this repository already suffered once. A hard assertion turns that silent
# skip into a red build. It observes the capability PREDICATE, not which path a
# given call took; that residual gap is named in the probe's own header, not
# papered over.
#
# It is ONE tracked source (tests/boys_avx2_probe.cpp) built as a CMake target
# and run by ctest, with the per-leg expectation passed as
# -DBOYS_EXPECT_AVX2=<0|1> at configure time. It used to be a heredoc pasted
# into five jobs and compiled by hand next to the library, which is why it
# failed on two legs for two reasons that had nothing to do with AVX2: the
# hand-compiled probe missed MSVC Debug's /MDd (the leg died on a CRT mismatch)
# and the sanitizer leg's -fsanitize flags (it died on undefined __asan_init).
# A target that LINKS boys inherits the configuration's CRT, sanitizers and
# architecture, so there is no second flag set left to keep in step. The probe
# is built only when the option is supplied, so developer builds are unaffected.

jobs:
  # -------------------------------------------------------------------------
  # ubuntu-latest, the configuration list, read and published as the matrix.
  #
  # The library carries several certified option axes - the multiply-add route,
  # the fit family, the evaluation scheme, the interval granularity, the
  # arithmetic precision, the host - and what CI owes each of them is a
  # configuration built and judged, not one dimension of one of them. Which
  # configurations those are is DATA: .github/option-matrix.json, generated by
  # tools/gen_option_matrix.py from the library's own declarations, and this
  # job is what turns it into the `matrix:` the option-matrix job below
  # expands. Enumerating the axes in this file instead would mean rewriting it
  # every time a lane certified a member; as data, a lane regenerates it.
  #
  # The generated file is checked against the library by
  # `tools/gen_option_matrix.py --check` on the legs that carry the other
  # generated-table gates, in both directions: a configuration cannot name a
  # member this revision does not carry, and a member this revision carries
  # cannot go unaccounted for. A refusal and a matrix entry therefore cannot
  # disagree about what exists.
  #
  # This job builds nothing. It is a job rather than a step because a matrix
  # has to exist before the jobs that expand it are scheduled.
  # -------------------------------------------------------------------------
  option-plan:
    name: option-matrix (the configuration list)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the configuration list
        id: read
        run: echo "matrix=$(python3 tools/gen_option_matrix.py --emit)" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Every allowed configuration: one build of the accuracy gate in the tree
  # that configuration names, and the gate run in it.
  #
  # What a configuration is, which axes it selects and why the matrix is over
  # those, is stated where the list is generated: tools/gen_option_matrix.py.
  #
  # WHAT IS JUDGED. The accuracy gate, with the FULL suite it holds: the lane
  # book's headline is the same in every configuration by construction - its
  # bounds are the fused route's published figures and do not move with the
  # build - while the route and evaluation-scheme books are measured per
  # configuration and are expected to differ. A configuration whose books do
  # not hold exits non-zero and fails this job; the run is verbose so the
  # verdict it reached is in the log rather than behind --output-on-failure.
  #
  # NO TIMING ANYWHERE IN THIS JOB, and none anywhere in this workflow. What
  # is measured is accuracy and counts. A hosted runner is shared, ephemeral
  # and unpinned, so a duration taken on one is a distribution and not a
  # value; the timed passes are local-only by design and record the machine,
  # the clock and the commit beside each number.
  #
  # COST. Six jobs, at most four at once (max-parallel below), so this job's
  # fan-out is bounded: the free tier allows 20 concurrent jobs across every
  # repository on the account, and the legs above already claim twelve.
  # -------------------------------------------------------------------------
  option-matrix:
    name: option-matrix ${{ matrix.name }}
    needs: option-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.option-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: matrix.toolchain == 'msvc'
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF
          ${{ matrix.generator }} ${{ matrix.cmake_args }}
      - name: Build (the accuracy gate target)
        run: cmake --build build ${{ matrix.build_jobs }} --target boys-accuracy-gate
      - name: Accuracy gate (this configuration's books)
        run: ctest --test-dir build -V -R boys-accuracy-gate

  # -------------------------------------------------------------------------
  # windows-latest, MSVC, Debug + Release. The original windows-msvc-release
  # job, unchanged, run for both configurations.
  # -------------------------------------------------------------------------
  windows-msvc:
    name: windows-msvc ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            expect_avx2: 1
          - build_type: Debug
            expect_avx2: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      # No Python, Doxygen or generator step on this job: the source-integrity
      # gates answer questions about the sources rather than about this leg's
      # configuration, so they run once, on the one linux-x86 combination that
      # carries them. See the note there.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }}
      - name: Build
        run: cmake --build build
      # The build's own facts, against the row docs/build-facts.md records for
      # this leg. A fact that moves - the target ISA, whether the arithmetic
      # contracts, whether the library calls the runtime's fma - fails the leg;
      # the runner's identity is reported and never gated, because a runner is
      # ephemeral. Until a leg's row is recorded the step prints the row to
      # record and passes, so a leg added here is never red for being new.
      - name: Build facts (probe vs docs/build-facts.md)
        run: .\build\boys-build-facts.exe --leg "windows-msvc ${{ matrix.build_type }}" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      - name: Boundary standalone check
        run: |
          New-Item -ItemType Directory -Force boundary-run | Out-Null
          cl /nologo /std:c++17 /EHsc /O2 tests/boys_boundary_standalone.cpp /Fe:boundary-run\boys-boundary-check.exe /Fo:boundary-run\
          Copy-Item tests/data/boys_reference.csv boundary-run\boys_reference.csv
          Set-Location boundary-run
          .\boys-boundary-check.exe
  # -------------------------------------------------------------------------
  # ubuntu-latest, GCC and Clang, Debug + Release. The original
  # linux-gcc-release job, unchanged, plus Clang and the Debug configurations.
  # -------------------------------------------------------------------------
  linux-x86:
    name: linux-x86 ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    # One leg of this job carries the generator, which re-derives the committed
    # tables at full precision and is by far the longest step anywhere in the
    # matrix - the rest of this leg is about seventy seconds. A ceiling that
    # truncates it would report a real check as a failure, so this job's limit
    # is set above what that step costs rather than at the round number the
    # other jobs share.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            cc: gcc
            cxx: g++
          - compiler: gcc
            build_type: Debug
            cc: gcc
            cxx: g++
          - compiler: clang
            build_type: Release
            cc: clang
            cxx: clang++
          - compiler: clang
            build_type: Debug
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      # The source-integrity gates below answer questions about the SOURCES:
      # whether the committed coefficient tables are what the generator
      # produces, whether the generated pages are what their generators render,
      # and whether the headers document cleanly. None of those answers depends
      # on the compiler or on the build type, so they are scoped to one
      # combination and produce their answer exactly once instead of once per
      # leg. The steps that DO depend on the configuration - the build, the
      # tests, and the build-facts probe against this leg's recorded row - are
      # left unscoped, which is what the matrix is for.
      - name: Set up Python + mpmath + clang-format (pinned)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet mpmath==1.4.1 clang-format==18.1.3 pyyaml==6.0.2
      - name: Install Doxygen 1.18.0 (pinned release)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          curl -L -sS -o /tmp/doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          echo "$(dirname "$(find /tmp/doxygen-1.18.0 -name doxygen -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1
      - name: Build
        run: cmake --build build -j 4
      # The build's own facts against this leg's recorded row: see the note in
      # the windows-msvc job for what it gates.
      - name: Build facts (probe vs docs/build-facts.md)
        run: ./build/boys-build-facts --leg "linux-x86 ${{ matrix.compiler }} ${{ matrix.build_type }}" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      # The generator re-derives the committed tables at full precision, and it
      # is the longest step anywhere in this matrix. Its inputs are the
      # generator itself and the two artefacts it produces: it reads no other
      # file, and the region boundaries it works to are its own constants rather
      # than anything it is given. So a revision touching none of those three
      # cannot have changed its answer, and re-deriving it would be proving
      # something that could not have moved.
      #
      # The default is to RUN. The skip happens only when the comparison against
      # the base revision succeeded AND the changed files it named are none of
      # the three - so an unknown base, a shallow clone or a failed fetch all
      # fall back to running the check rather than to skipping it.
      - name: Did the generator's inputs change?
        id: gen
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          run=yes
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            # The files THIS revision touched, asked as a commit range rather
            # than as a tree-to-tree diff: a diff against the base answers a
            # different question - everything that differs between two trees,
            # including everything the base branch did meanwhile - so it names
            # these files on every run and the skip would never fire.
            if git fetch --quiet --depth=1 origin "$base" 2>/dev/null &&
               changed="$(git log --name-only --format= "$base"..HEAD 2>/dev/null)"; then
              if ! printf '%s\n' "$changed" |
                   grep -qE '^(tools/gen_boys_coefficients\.py|include/boys/boys_coefficients\.hpp|tests/data/boys_reference\.csv)$'; then
                run=no
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "generator byte-identity will run: $run"
      - name: Generator byte-identity (a fresh generation, compared byte for byte)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' && steps.gen.outputs.run == 'yes' }}
        env:
          CLANG_FORMAT: ${{ github.workspace }}/.venv/bin/clang-format
        run: |
          .venv/bin/python tools/gen_boys_coefficients.py --check --header include/boys/boys_coefficients.hpp --reference tests/data/boys_reference.csv
      - name: Generated tables (platform table, build-facts page, option matrix)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: |
          .venv/bin/python tools/gen_platform_table.py --check
          .venv/bin/python tools/gen_option_matrix.py --check
          .venv/bin/python tools/gen_build_facts.py --check
      - name: Boundary standalone check
        run: |
          mkdir -p boundary-run
          g++ -std=c++17 -O2 tests/boys_boundary_standalone.cpp -o boundary-run/boys-boundary-check
          cp tests/data/boys_reference.csv boundary-run/boys_reference.csv
          cd boundary-run && ./boys-boundary-check
      - name: Docs (zero-warning Doxygen gate)
        if: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Release' }}
        run: cmake --build build --target boys-docs
  # -------------------------------------------------------------------------
  # ubuntu-latest, AddressSanitizer + UndefinedBehaviorSanitizer. For kernel
  # code this is the highest value per minute on the board: the region
  # partitioning, the 4-lane vector tails and the padded coefficient tables are
  # exactly where an out-of-bounds or a signed-overflow would live.
  # -------------------------------------------------------------------------
  linux-sanitizers:
    name: linux-sanitizers asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=1 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 4
      # The probe is built and run under the sanitizers like everything else
      # here, so this leg also states that reading the build's own facts is
      # clean under them.
      - name: Build facts (probe vs docs/build-facts.md)
        run: ./build/boys-build-facts --leg "linux-sanitizers asan+ubsan" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion, under the sanitizers)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
  # -------------------------------------------------------------------------
  # ubuntu-24.04-arm, GCC. NEON vs AVX2: this catches x86-only assumptions.
  # It was red on the first run — the finding it exists to produce — and now
  # builds and runs the full suite with the AVX2 tier absent by construction.
  # -------------------------------------------------------------------------
  linux-arm64:
    name: linux-arm64 gcc Release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=0
      - name: Build
        run: cmake --build build -j 4
      # This leg's row is the arm64 statement: the target ISA the build names,
      # whether the arithmetic contracts, and what the library's own report says
      # about the multiply-add it carries. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        run: ./build/boys-build-facts --leg "linux-arm64 gcc Release" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
  # -------------------------------------------------------------------------
  # windows-11-arm, MSVC arm64.
  #
  # The first run of this leg was RED FOR THE WRONG REASON and the fix is the
  # interesting part: ilammy/msvc-dev-cmd defaults to host=x64, so the leg was
  # building an x64 binary and running it under Windows' x64 emulation on the
  # ARM64 runner. It reported BoysAvx2Available() = true, correctly — for an
  # x64 build. That is a green-looking leg with no arm64 subject at all, so the
  # arch is now stated explicitly rather than inherited from the action's
  # default.
  # -------------------------------------------------------------------------
  windows-arm64:
    name: windows-arm64 msvc Release
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: arm64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=0
      - name: Build
        run: cmake --build build
      # The arm64 MSVC row. The probe reads no CPUID here - the target has none,
      # and the build would not compile if it asked - so the processor line is
      # the operating system's report. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        run: .\build\boys-build-facts.exe --leg "windows-arm64 msvc Release" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'

  # -------------------------------------------------------------------------
  # macOS, AppleClang: macos-latest is Apple Silicon (arm64 — the AVX2 tier is
  # absent there, asserted as such) and macos-15-intel is the x64 runner that
  # actually has AVX2.
  # -------------------------------------------------------------------------
  macos:
    name: macos ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: arm64
            doxygen_asset: doxygen-1.18.0-mac-arm.zip
            expect_avx2: 0
          - runner: macos-15-intel
            label: x64
            doxygen_asset: doxygen-1.18.0-mac-intel.zip
            expect_avx2: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      # No Python, Doxygen or generator step on this job: the source-integrity
      # gates answer questions about the sources rather than about this leg's
      # configuration, so they run once, on the one linux-x86 combination that
      # carries them. See the note there.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF -DBOYS_EXPECT_AVX2=${{ matrix.expect_avx2 }}
      - name: Build
        run: cmake --build build -j 3
      # Both macOS rows: the arm64 one states the arm64 facts and the x64 one
      # whether std::fma survives as a call on a target that has the
      # instruction. See the note in the windows-msvc job.
      - name: Build facts (probe vs docs/build-facts.md)
        run: ./build/boys-build-facts --leg "macos ${{ matrix.label }}" --check docs/build-facts.md
      - name: Test (full suite + dispatch assertion)
        run: ctest --test-dir build --output-on-failure
      # ctest prints a test's output only when the test FAILS, so on a green
      # run the accuracy gate's verdict - the claim count and the fraction of
      # comparison cells that can discriminate - never reaches this log, and
      # the two consumer checks report what they covered to nobody. This
      # re-runs the same three programs with their output shown: same
      # binaries, same exit statuses as the ctest step above.
      - name: Verdicts (accuracy gate and consumer checks)
        run: ctest --test-dir build -V -R 'boys-accuracy-gate|boys-consumer-'
      - name: Boundary standalone check
        run: |
          mkdir -p boundary-run
          c++ -std=c++17 -O2 tests/boys_boundary_standalone.cpp -o boundary-run/boys-boundary-check
          cp tests/data/boys_reference.csv boundary-run/boys_reference.csv
          cd boundary-run && ./boys-boundary-check
  # -------------------------------------------------------------------------
  # ubuntu-latest, clang-tidy over the project's own compile database.
  #
  # A leg of its own, not a step on a build leg: a tidy failure has to be
  # attributable to tidy. The project rule applies verbatim — tidy issues are first
  # reported LOCALLY, and CI is the backstop — so the gate here is the FAILURE
  # MODE of a tidy run rather than its findings: zero `error:` diagnostics and
  # no "Error while processing" line, i.e. every TU parsed. The baseline check
  # set in .clang-tidy prints its findings into the log for the author.
  #
  # boys has no PCH (CMakeLists: "No PCH in this tree"), so the compile
  # database is self-sufficient and no materialise-the-PCHs step is needed.
  # No external tidy script is imported: a tool that assumes another tree's
  # layout is the defect class this project keeps finding. This uses boys'
  # own database instead.
  # -------------------------------------------------------------------------
  clang-tidy:
    name: linux-x86 clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Configure (compile database)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BENCHMARKS=OFF -DBUILD_CUDA=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy over the library and test TUs
        run: |
          clang-tidy --version
          python3 - <<'PY' > /tmp/tidy-sources.txt
          import json, pathlib
          db = json.load(open("build/compile_commands.json"))
          for entry in db:
              path = pathlib.Path(entry["file"]).resolve()
              if "third_party" in path.parts:
                  continue
              print(path)
          PY
          : > tidy.log
          while read -r src; do
            echo "=== clang-tidy ${src}" | tee -a tidy.log
            clang-tidy -p build "${src}" >> tidy.log 2>&1 || true
          done < /tmp/tidy-sources.txt
          echo "--- findings ---"
          grep -E "warning:|error:" tidy.log | head -50 || true
          if grep -qE ": error:|Error while processing" tidy.log; then
            echo "clang-tidy could not process every TU: the run is not usable."
            exit 1
          fi
          echo "clang-tidy: every TU parsed, no error: diagnostics"
